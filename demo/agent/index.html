        gu:n=>`નમસ્તે! ${n} ને મેસેજ કરવા બદલ આભાર. હું થોડી વિગતો લઈ લઉં જેથી યોગ્ય વ્યક્તિ તમારી મદદ કરી શકે.`},
 ack:{en:['Got it.','Noted.'],hl:['Theek hai.','Samajh gaya.'],hi:['ठीक है।','समझ गया।'],gu:['બરાબર.','સમજાઈ ગયું.']},
 book:{en:o=>`Thanks! When should ${o} call you?`,hl:o=>`Dhanyavaad! ${o} aapko kab call karein?`,hi:o=>`धन्यवाद! ${o} आपको कब कॉल करें?`,gu:o=>`આભાર! ${o} તમને ક્યારે કૉલ કરે?`},
 slots:{en:['today, 5 PM','tomorrow, 11 AM','tomorrow, 4 PM'],hl:['aaj shaam 5 baje','kal subah 11 baje','kal shaam 4 baje'],hi:['आज शाम 5 बजे','कल सुबह 11 बजे','कल शाम 4 बजे'],gu:['આજે સાંજે 5 વાગ્યે','કાલે સવારે 11 વાગ્યે','કાલે સાંજે 4 વાગ્યે']},
 done:{en:(o,s)=>`Done ✅ ${o} will call you ${s}.`,hl:(o,s)=>`Ho gaya ✅ ${o} aapko ${s} call karenge.`,hi:(o,s)=>`हो गया ✅ ${o} आपको ${s} कॉल करेंगे।`,gu:(o,s)=>`થઈ ગયું ✅ ${o} તમને ${s} કૉલ કરશે.`}
};

/* ---------------- state ---------------- */
const S = {tab:0, biz:'wholesale', name:P.wholesale.name, qs:P.wholesale.q.en.slice(), lang:'hl', chat:[], stage:0, ans:[], callAt:null, leadLang:null, typing:false, min:42,
  bc:{text:P.wholesale.bc, sent:0, sending:false, replies:0}, leads:500};
let timers=[]; const later=(f,ms)=>timers.push(setTimeout(f,ms));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const biz=()=>P[S.biz];
const edited=i=>S.qs[i].trim()!==biz().q.en[i];
const qText=(i,l)=>edited(i)||l==='en'?S.qs[i].trim():biz().q[l][i];
const clock=()=>`11:${String(S.min).padStart(2,'0')} PM`;
function detect(t){ if(/[઀-૿]/.test(t)) return 'gu'; if(/[ऀ-ॿ]/.test(t)) return 'hi'; if(/\b(hai|kya|kitna|kitni|chahiye|bhaiya|bhai|dena|karna|nahi|haan|ji|mein|ka|ki|ko|bhejo|kab|aap)\b/i.test(t)) return 'hl'; return 'en'; }

/* ---------------- chat engine ---------------- */
function resetChat(){ timers.forEach(clearTimeout); timers=[]; Object.assign(S,{chat:[],stage:0,ans:[],callAt:null,leadLang:null,typing:false,min:42}); }
function agentSay(text, extra={}){ S.typing=true; render(); later(()=>{ S.typing=false; S.chat.push({from:'ai',text,time:clock(),...extra}); render(); }, 1100); }
function customer(text, voice=false){
  if(S.typing||S.stage>=5) return;
  const l = voice ? (S.leadLang||S.lang) : detect(text);
  S.leadLang=l;
  S.chat.push({from:'me',text,voice,time:clock()});
  S.min=Math.min(59,S.min+1);
  const L=S.leadLang||l;
  if(S.stage===0){ S.stage=1; agentSay(T.greet[L](S.name)+'\n\n'+qText(0,L)); }
  else if(S.stage<=3){ S.ans[S.stage-1]=text; const i=S.stage; S.stage++;
    if(i<3) agentSay(T.ack[L][i%2]+' '+qText(i,L)); else agentSay(T.book[L](biz().owner),{slots:true}); }
  render();
}
function pickSlot(i){ if(S.stage!==4||S.typing) return; const L=S.leadLang; const s=T.slots[L][i]; S.chat.push({from:'me',text:s,time:clock()}); S.callAt={i,L}; S.stage=5; agentSay(T.done[L](biz().owner,s)); }

/* ---------------- views ---------------- */
const TABS=['Set your questions','Be the customer','Send a broadcast','Pricing'];
const phone=(inner)=>`<div class="phone"><div class="scr"><div class="sb"><span>${S.tab===1?clock():'10:30 AM'}</span><span>5G ▮▮▮ 82%</span></div>${inner}</div></div>`;
const head=(sub)=>`<div class="wa-h"><span class="av">${esc(S.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase())}</span><div><b>${esc(S.name)}</b><small>${sub}</small></div></div>`;

function viewSetup(){
  return {left:`<div class="kick">Step 1 · You decide</div><h1>Tell the agent what to ask every customer.</h1>
  <p>Pick your type of business, change the name, and edit the three questions. The agent asks these on WhatsApp, in the customer's language, and then books a call.</p>
  <div class="field"><label>Your type of business</label><div class="chips">${Object.keys(P).map(k=>`<button class="${k===S.biz?'on':''}" data-a="biz" data-k="${k}">${P[k].label}</button>`).join('')}</div></div>
  <div class="field"><label for="bname">Business name</label><input id="bname" value="${esc(S.name)}" data-in="name" maxlength="40"></div>
  ${S.qs.map((q,i)=>`<div class="field"><label for="q${i}" class="qnum"><span>${i+1}</span>Question ${i+1}</label><input id="q${i}" value="${esc(q)}" data-in="q" data-k="${i}" maxlength="90"></div>`).join('')}
  <p class="note">The real agent translates your questions into the customer's language automatically. In this demo, edited questions show as you typed them.</p>
  <div class="row-btns"><button class="btn pri" data-a="tab" data-k="1">Now be the customer →</button></div>`,
  stage:phone(`${head('AI agent preview')}<div class="wa-b"><span class="day">What a customer sees first</span>
   <div class="m"><span class="ai">AI agent</span>${esc(T.greet.en(S.name))}\n\n${esc(S.qs[0])}<small>10:30 AM</small></div>
   <div class="m" style="opacity:.75"><span class="ai">then</span>${esc(S.qs[1])}</div>
   <div class="m" style="opacity:.75"><span class="ai">then</span>${esc(S.qs[2])}</div>
   <div class="m" style="opacity:.75"><span class="ai">then</span>${esc(T.book.en(biz().owner))}</div></div>`)};
}

function viewChat(){
  const L=S.leadLang||S.lang;
  let sug=[];
  if(S.stage===0) sug=[biz().first[S.lang]];
  else if(S.stage>=1&&S.stage<=3) sug=[biz().a[L][S.stage-1]];
  const lead = S.stage>=2 ? `<div class="lead"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px"><b>Rohit · +91 98260 41xxx</b><span class="pill ${S.callAt?'g':'a'}">${S.callAt?'Call booked':'Collecting details'}</span></div>
   <div class="kv"><span>Language</span><b>${LANGS[S.leadLang]}</b>${S.qs.map((q,i)=>`<span>${esc(q)}</span><b>${S.ans[i]?esc(S.ans[i]):'…'}</b>`).join('')}<span>Call time</span><b>${S.callAt?esc(T.slots.en[S.callAt.i]):'…'}</b><span>First reply</span><b>3 seconds, at 11:42 PM</b></div></div>` : `<p class="note" style="margin:6px 0 0">Send a message in the phone. The lead appears here as the agent collects it.</p>`;
  return {left:`<div class="kick">Step 2 · Try it yourself</div><h1>Message ${esc(S.name)} at 11:42 PM.</h1>
  <p>You're the customer now. Everyone at the shop is asleep. Type anything, tap a suggested reply, or send a voice note, in any language.</p>
  <div class="field"><label>Write as a customer in</label><div class="chips">${Object.keys(LANGS).map(k=>`<button class="${k===S.lang?'on':''}" data-a="lang" data-k="${k}">${LANGS[k]}</button>`).join('')}</div></div>
  <p class="note">The agent replies in whatever language you write in. Try switching to Hindi or Gujarati halfway.</p>
  <div class="inbox"><h3>Your lead inbox</h3><span class="note">What you see in the morning</span>${lead}</div>
  <div class="row-btns"><button class="btn" data-a="restart">Start the chat again</button>${S.callAt?'<button class="btn pri" data-a="tab" data-k="2">Next: send a broadcast →</button>':''}</div>`,
  stage:phone(`${head(S.typing?'typing…':'online · replies 24×7')}<div class="wa-b" id="chat"><span class="day">Today</span>
   ${S.chat.map(m=>`<div class="m ${m.from==='me'?'out':''}">${m.from==='ai'?'<span class="ai">AI agent</span>':''}${m.voice?`<span class="vn">▶ <i></i> 0:06</span><span class="tr">"${esc(m.text)}"</span>`:esc(m.text)}<small>${m.time}${m.from==='me'?' ✓✓':''}</small></div>${m.slots&&S.stage===4?`<div class="qr-row">${T.slots[S.leadLang].map((s,i)=>`<button data-a="slot" data-k="${i}">${esc(s)}</button>`).join('')}</div>`:''}`).join('')}
   ${S.typing?'<div class="typing">AI agent is typing…</div>':''}</div>
   ${sug.length&&!S.typing?`<div class="sugg">${sug.map(s=>`<button data-a="say" data-t="${esc(s)}">${esc(s)}</button>`).join('')}</div>`:''}
   <form class="compose" data-form="chat"><input id="msg" placeholder="${S.stage>=5?'Chat finished':'Type a message'}" autocomplete="off" ${S.stage>=4?'disabled':''}><button type="button" class="cbtn" data-a="voice" aria-label="Send a voice note" ${S.stage===0||S.stage>=4?'disabled':''}>🎤</button><button class="cbtn" aria-label="Send" ${S.stage>=4?'disabled':''}>➤</button></form>`)};
}

function viewBroadcast(){
  const n=248, cost=n*1.5, b=S.bc;
  return {left:`<div class="kick">Step 3 · Broadcasts</div><h1>Send one offer to every customer at once.</h1>
  <p>Write the offer once and send it to your whole list. When someone replies, the AI agent takes over and asks your questions.</p>
  <div class="field"><label for="bc">Your offer message</label><textarea id="bc" data-in="bc" ${b.sending||b.sent?'disabled':''}>${esc(b.text)}</textarea></div>
  <div class="stats"><div><b>${n}</b><span>customers on your list</span></div><div><b>${inr(cost)}</b><span>cost of this broadcast (₹1.50 each)</span></div><div><b>${b.replies}</b><span>replies handled by the agent</span></div></div>
  <div class="row-btns">${b.sent?'<button class="btn" data-a="bc-reset">Write another</button><button class="btn pri" data-a="tab" data-k="3">See pricing →</button>':`<button class="btn wa" data-a="bc-send" ${b.sending?'disabled':''}>${b.sending?'Sending…':'Send to '+n+' customers'}</button>`}</div>`,
  stage:phone(`${head('Broadcast list · 248 customers')}<div class="wa-b">
   <div class="m out">${esc(b.text)}<small>10:30 AM ${b.sent?'✓✓':''}</small></div>
   ${b.sending||b.sent?`<div class="bc-card"><h4>Delivered</h4><div class="prog"><i style="width:${Math.round(b.sentCount/n*100)}%"></i></div><b>${b.sentCount} of ${n}</b></div>`:''}
   ${biz().replies.slice(0,b.replies).map(r=>`<div class="rep"><b>${esc(r[0])}</b><p>${esc(r[1])}</p><div class="ag">AI agent: ${esc(r[2])}</div></div>`).join('')}
  </div>`)};
}

function viewPricing(){
  const L=S.leads; const plan = L<=500?0:L<=1000?1:L<=5000?2:3;
  const plans=[['Up to 500 leads','₹1,500'],['Up to 1,000 leads','₹2,500'],['Up to 5,000 leads','₹9,000'],['5,000+ leads','Custom']];
  return {full:true,left:`<div class="kick">Step 4 · Pricing</div><h1>Pay for the leads you get. Nothing else.</h1>
  <div class="slider"><label for="leads" class="note">How many enquiries do you get on WhatsApp in a month?</label><div class="big" id="leadsBig">${L>=6000?'5,000+':L.toLocaleString('en-IN')} leads</div><input id="leads" type="range" min="100" max="6000" step="100" value="${L}" data-in="leads"></div>
  <div class="plans">${plans.map((p,i)=>`<div class="plan ${i===plan?'on':''}" data-i="${i}"><em>${p[0]}</em>${i<3?`<b>${p[1]}</b><span class="note">per month + GST</span>`:`<b>${p[1]}</b><span class="note">built for your volume</span><span class="note">Contact us for pricing</span>`}<span class="pill a fit" ${i===plan?'':'hidden'}>Fits you</span></div>`).join('')}</div>
  <div class="every"><b>Every plan:</b> setup by us · AI agent replies, asks your questions, books the call · text and voice notes · any language · WhatsApp charges included</div>
  <p class="note" style="margin-top:10px">Prices + GST. Broadcasts extra: ₹1.50 each, as needed.</p>
  <div class="contact"><span>Book a free 30-minute call</span><b id="ph">+91 79734 13659</b><button data-a="copy">Copy number</button><span id="cp"></span></div>`, stage:''};
}

/* ---------------- render ---------------- */
function render(){
  document.getElementById('tabs').innerHTML=TABS.map((t,i)=>`<button class="${i===S.tab?'on':''}" data-a="tab" data-k="${i}" ${i===S.tab?'aria-current="page"':''}><b>${i+1}</b>${t}</button>`).join('');
  const v=[viewSetup,viewChat,viewBroadcast,viewPricing][S.tab]();
  const focused=document.activeElement&&document.activeElement.id; const sel=focused&&document.activeElement.selectionStart;
  document.getElementById('main').className='main'+(v.full?' full':'');
  document.getElementById('left').innerHTML=v.left;
  document.getElementById('stage').innerHTML=v.stage; document.getElementById('stage').hidden=!v.stage;
  const c=document.getElementById('chat'); if(c) c.scrollTop=c.scrollHeight;
  if(focused){ const el=document.getElementById(focused); if(el && !el.disabled){ el.focus(); try{ if(sel!=null) el.setSelectionRange(sel,sel);}catch(e){} } }
}

/* ---------------- events ---------------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el||el.disabled) return;
  const a=el.dataset.a, k=el.dataset.k;
  if(a==='tab'){ S.tab=+k; render(); window.scrollTo({top:0,behavior:'smooth'}); }
  else if(a==='biz'){ S.biz=k; S.name=P[k].name; S.qs=P[k].q.en.slice(); S.bc={text:P[k].bc,sent:0,sending:false,replies:0}; resetChat(); render(); }
  else if(a==='lang'){ S.lang=k; render(); }
  else if(a==='say'){ customer(el.dataset.t); }
  else if(a==='voice'){ const L=S.leadLang||S.lang; if(S.stage>=1&&S.stage<=3) customer(biz().a[L][S.stage-1],true); }
  else if(a==='slot'){ pickSlot(+k); }
  else if(a==='restart'){ resetChat(); render(); }
  else if(a==='bc-send'){ const n=248; S.bc.sending=true; S.bc.sentCount=0; render(); let c=0; const tick=()=>{ c=Math.min(n,c+31); S.bc.sentCount=c; if(c<n){ render(); later(tick,120);} else { S.bc.sending=false; S.bc.sent=1; render(); [900,1900,2900].forEach((t,i)=>later(()=>{S.bc.replies=i+1; render();},t)); } }; later(tick,150); }
  else if(a==='bc-reset'){ S.bc={text:biz().bc,sent:0,sending:false,replies:0}; render(); }
  else if(a==='copy'){ const t='+91 79734 13659'; const ok=()=>{const c=document.getElementById('cp'); if(c) c.textContent='Copied';}; try{ navigator.clipboard.writeText(t).then(ok,selectPh);}catch(err){ selectPh(); } }
});
function selectPh(){ const p=document.getElementById('ph'); if(!p) return; const r=document.createRange(); r.selectNodeContents(p); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
document.addEventListener('submit',e=>{ const f=e.target.closest('[data-form="chat"]'); if(!f) return; e.preventDefault(); const i=document.getElementById('msg'); const t=i.value.trim(); if(t){ i.value=''; customer(t); } });
document.addEventListener('input',e=>{
  const el=e.target; const t=el.dataset.in; if(!t) return;
  if(t==='name'){ S.name=el.value||P[S.biz].name; refreshStage(); }
  else if(t==='q'){ S.qs[+el.dataset.k]=el.value; resetChat(); refreshStage(); }
  else if(t==='bc'){ S.bc.text=el.value; refreshStage(); }
  else if(t==='leads'){ S.leads=+el.value; const L=S.leads, plan=L<=500?0:L<=1000?1:L<=5000?2:3; document.getElementById('leadsBig').textContent=(L>=6000?'5,000+':L.toLocaleString('en-IN'))+' leads'; document.querySelectorAll('.plan').forEach(p=>{const on=+p.dataset.i===plan; p.classList.toggle('on',on); p.querySelector('.fit').hidden=!on;}); }
});
function refreshStage(){ const v=[viewSetup,viewChat,viewBroadcast,viewPricing][S.tab](); document.getElementById('stage').innerHTML=v.stage; }
render();
</script>
