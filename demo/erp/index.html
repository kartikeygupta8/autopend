const Q=[['owe','Which shops owe the most?','Kaun sabse zyada baaki hai?'],['cash','Cash still with salesmen','Salesman ke paas kitna cash hai?'],['ord','Orders not delivered yet','Kaun se order deliver nahi hue?'],['sales','Total sales this month','Is mahine kitni sale hui?'],['stock','How much oil is left?','Kitna tel bacha hai?']];
function answer(k,hl){
 if(k==='owe'){ const t=[...S.customers].filter(c=>c.due).sort((a,b)=>b.due-a.due).slice(0,4); const s=t.map((c,i)=>`${i+1}. ${c.name}: ${inr(c.due)} (${c.days} ${hl?'din':'days'})`).join('\n'); return [hl?`Market mein ${inr(total())} baaki hai. Sabse bade:\n${s}\n\n60 din se purana: ${inr(old60())}.`:`${inr(total())} is due from ${S.customers.filter(c=>c.due).length} shops. The biggest:\n${s}\n\nOlder than 60 days: ${inr(old60())}.`,'customer dues'];}
 if(k==='cash'){ if(!S.pending.length) return [hl?'Kisi salesman ke paas cash pending nahi hai. Sab verify ho chuka hai.':'No cash is pending with salesmen. Everything is verified.','pending handover']; const by={}; S.pending.forEach(p=>by[p.sm]=(by[p.sm]||0)+p.amt); const s=Object.entries(by).map(([n,a])=>`${n}: ${inr(a)}`).join('\n'); return [hl?`${inr(pendTot())} abhi salesmen ke paas hai, handover baaki:\n${s}`:`${inr(pendTot())} collected by salesmen is still waiting for handover:\n${s}`,'pending handover'];}
 if(k==='ord'){ const os=S.orders.filter(o=>o.st!=='delivered'); if(!os.length) return [hl?'Saare order deliver ho gaye.':'All orders are delivered.','orders']; const s=os.map(o=>`${o.id} · ${o.cust} · ${o.st==='part'?`${o.done}/${o.qty} ${hl?'deliver hua':'delivered'}`:o.st} · ${inr(ordAmt(o))}`).join('\n'); return [hl?`${os.length} order abhi deliver nahi hue:\n${s}`:`${os.length} orders are not fully delivered:\n${s}`,'orders'];}
 if(k==='sales') return [hl?`Is mahine ${inr(S.salesMonth)} ki sale hui, ${S.ordersMonth} orders se.`:`Sales this month: ${inr(S.salesMonth)} from ${S.ordersMonth} orders.`,'delivered orders'];
 if(k==='stock') return [hl?`Tank mein abhi ${S.stockKg.toLocaleString('en-IN')} kg tel hai. Pack kiya hua maal: 1L ke ${S.packed.l1} box, 5L ke ${S.packed.l5} box, 15L ke ${S.packed.t15} tin.`:`${S.stockKg.toLocaleString('en-IN')} kg of oil in the tank. Packed stock: ${S.packed.l1} boxes of 1L, ${S.packed.l5} boxes of 5L, ${S.packed.t15} tins of 15L.`,'oil stock, packed stock'];
 return [hl?'Main baaki, cash, order, sale aur stock ke baare mein bata sakta hoon. Neeche ka koi sawaal try kijiye.':'I can answer about dues, cash, orders, sales and stock. Try one of the questions below.','—'];
}
function route(t){ t=t.toLowerCase(); if(/owe|due|baaki|baki|udhaar|udhar|बाकी|उधार|pending from/.test(t)&&!/cash|nakad|नकद/.test(t)) return 'owe'; if(/cash|handover|nakad|salesman|नकद/.test(t)) return 'cash'; if(/order|deliver|packed|ऑर्डर/.test(t)) return 'ord'; if(/sale|sales|bikri|बिक्री|revenue/.test(t)) return 'sales'; if(/stock|oil|tel|tank|bacha|तेल|स्टॉक/.test(t)) return 'stock'; return 'x'; }
function ask(text,k){ if(S.credits<=0) return; const hl=S.aiLang==='hi'||/[ऀ-ॿ]/.test(text)||/\b(kitna|kitni|kaun|hai|bacha|baaki|hui|kya)\b/i.test(text); const [a,src]=answer(k||route(text),hl); S.chat.push({q:text,a,src}); S.credits--; render(); const c=document.getElementById('aichat'); if(c) c.scrollTop=c.scrollHeight; }

 ${mine?`<div class="mine">Your answers from the quick test: <b>${esc(S.mineTotal||'?')}</b> in the market, <b>${esc(S.mineOld||'?')}</b> older than 60 days. Bring these to the call and we'll show you the same screen with your shops.</div>`:''}
 <div class="contact"><span>Book a free 30-minute call</span><b id="ph">+91 79734 13659</b><button data-a="copy">Copy number</button><span id="cp"></span></div>`,stage:''};

const VIEWS=[vTest,vCredit,vCash,vRates,vOrders,vStaff,vAI,vPrice];
function render(){
 document.getElementById('tabs').innerHTML=TABS.map((t,i)=>`<button class="${i===S.tab?'on':''}" data-a="tab" data-k="${i}" ${i===S.tab?'aria-current="page"':''}>${t[0]?`<span class="lk">${t[0]}</span>`:''}${t[1]}</button>`).join('');
 const v=VIEWS[S.tab]();
 document.getElementById('main').className='main'+(v.full?' full':'');
 document.getElementById('left').innerHTML=v.left;
 const st=document.getElementById('stage'); st.innerHTML=v.stage; st.hidden=!v.stage;
 const c=document.getElementById('aichat'); if(c) c.scrollTop=c.scrollHeight;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]'); if(!el||el.disabled) return; const a=el.dataset.a, k=el.dataset.k;
 if(a==='tab'){ S.tab=+k; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
 if(a==='reveal'){ S.revealed=true; }
 else if(a==='sel'){ S.sel=k; S.orderCheck=null; }
 else if(a==='check'){ S.orderCheck=S.sel; }
 else if(a==='credit'){ const c=S.customers.find(x=>x.id===S.sel); c.credit=!c.credit; addLog('Owner',`turned credit ${c.credit?'on':'off'} for ${c.name}`); }
 else if(a==='logcash'){ const c=S.customers.find(x=>x.id===S.coll.cust); const amt=Math.max(0,Math.min(Number(S.coll.amt)||0,c.due)); if(!amt) return; c.due-=amt; S.pending.push({id:Date.now(),amt,cust:c.name,sm:'Rakesh',ord:'cash · '+now()}); S.logged=true; addLog('Rakesh',`logged ${inr(amt)} cash from ${c.name}`); }
 else if(a==='verify'){ const i=S.pending.findIndex(p=>String(p.id)===k); if(i>-1){ const p=S.pending.splice(i,1)[0]; S.verified.push(p); addLog('Owner',`verified ${inr(p.amt)} handed over by ${p.sm}`);} }
 else if(a==='rate'){ const nr=Number(S.newRate)||S.rates.l1.p; S.rateChanged=true; if(S.rateFrom==='today') S.rates.l1.p=nr; addLog('Owner',`changed 1L box rate to ${inr(nr)} (${S.rateFrom==='today'?'from now':'from tomorrow'})`); }
 else if(a==='disc'){ S.discAsk=true; addLog('Mohit','asked for ₹50/box discount for Jain General Store'); }
 else if(a==='book'){ const o={id:'ORD-'+(S.nextOrd++),cust:S.newOrd.cust,qty:Math.max(1,Number(S.newOrd.qty)||1),item:'l1',st:'pending',done:0}; S.orders.unshift(o); addLog('Owner',`booked ${o.id} for ${o.cust} from a phone call`); }
 else if(a==='pack'){ const o=S.orders.find(x=>x.id===k); o.st='packed'; addLog('Godown',`packed ${o.id}`); }
 else if(a==='partdel'){ const o=S.orders.find(x=>x.id===k); o.done=Math.max(1,Math.floor(o.qty/2)); o.st='part'; addLog('Driver',`delivered ${o.done} of ${o.qty} for ${o.id}`); }
 else if(a==='deliver'){ const o=S.orders.find(x=>x.id===k); const add=(o.qty-o.done)*S.rates[o.item].p; o.done=o.qty; o.st='delivered'; S.salesMonth+=add; S.ordersMonth++; const c=cust(o.cust); if(c){ c.due+=add; if(!c.days) c.days=1; } addLog('Driver',`delivered ${o.id} to ${o.cust}`); }
 else if(a==='leave'){ S.left=true; addLog('Owner','closed Rakesh\'s login'); }
 else if(a==='move'){ S.customers.forEach(c=>{ if(c.sm==='Rakesh') c.sm=S.moveTo; }); S.moved=true; addLog('Owner',`moved Rakesh's shops to ${S.moveTo}, with history`); }
 else if(a==='ailang'){ S.aiLang=k; }
 else if(a==='ask'){ const q=Q.find(x=>x[0]===k); ask(S.aiLang==='hi'?q[2]:q[1],k); return; }
 else if(a==='copy'){ const t='+91 79734 13659'; const ok=()=>{const c=document.getElementById('cp'); if(c) c.textContent='Copied';}; try{ navigator.clipboard.writeText(t).then(ok,selectPh);}catch(err){ selectPh(); } return; }
 render();
});
function selectPh(){ const p=document.getElementById('ph'); if(!p) return; const r=document.createRange(); r.selectNodeContents(p); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
document.addEventListener('submit',e=>{ const f=e.target.closest('[data-form="ask"]'); if(!f) return; e.preventDefault(); const i=document.getElementById('askin'); const t=i.value.trim(); if(t) ask(t); });
document.addEventListener('input',e=>{ const t=e.target.dataset.in; if(!t) return; const v=e.target.value;
 if(t==='mineTotal') S.mineTotal=v; else if(t==='mineOld') S.mineOld=v;
 else if(t==='collAmt') S.coll.amt=v; else if(t==='newRate') S.newRate=v; else if(t==='noQty') S.newOrd.qty=v; });
document.addEventListener('change',e=>{ const t=e.target.dataset.in; if(!t) return; const v=e.target.value;
 if(t==='collCust'){ S.coll.cust=v; render(); } else if(t==='rateFrom'){ S.rateFrom=v; } else if(t==='noCust'){ S.newOrd.cust=v; } else if(t==='moveTo'){ S.moveTo=v; } else if(t==='collAmt'){ render(); } });
render();
</script>
