  --dev-frame:#000000; color-scheme:dark }}
:root[data-theme="dark"]{

html,body{background:var(--bg);color:var(--ink)}

<script>
const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
const STEPS = ['Meet the business','Order on WhatsApp','AI writes the order','Credit check','Into Tally','Who to remind','Reminder sent','Payment approved','Next morning','The whole day'];
const S = {step:0, sheet1:false, s2:'reading', choice:null, s4:'idle', sent:false, paid:false, sheet6:false, over:null, s7:'reading', thanks:false, s8:'lock', ask:null};
let timers = [];
function later(fn, ms){ timers.push(setTimeout(fn, ms)); }

function collected(){ return (S.s7==='approved' ? 38900 : 0) + (S.choice==='collect' && S.s4!=='idle' ? 18100 : 0); }
function tallyCount(){ let n=0; if(['synced','accepted'].includes(S.s4)) n++; if(S.s7==='approved') n++; return n; }

function go(n){
  timers.forEach(clearTimeout); timers=[];
  S.step = Math.max(0, Math.min(STEPS.length-1, n));
  if(S.step===2 && S.s2!=='ready'){ S.s2='reading'; later(()=>{S.s2='ready'; render();}, 1400); }
  if(S.step===6 && S.sent && !S.paid){ later(()=>{S.paid=true; render();}, 1500); }
  if(S.step===7 && S.s7==='reading'){ later(()=>{S.s7='ready'; render();}, 1400); }
  render();
  const tp=document.getElementById('top'); if(tp && tp.getBoundingClientRect().top<0) tp.scrollIntoView({block:'start',behavior:'smooth'});
}

function isDone(i){
  return [true, S.step>1, S.s2==='ready'&&S.step>2, !!S.choice, S.s4==='accepted', S.sent, S.paid, S.s7==='approved', S.s8==='open', false][i];
}

/* ---------- helpers ---------- */
const phone = (inner, time='10:02', dark=false) => `<div class="phone"><div class="scr"><div class="sb${dark?' dk':''}"><span>${time}</span><span>5G ▮▮▮ 82%</span></div>${inner}</div></div>`;
const apHead = (name, role) => `<div class="ap-h"><span class="dot"></span><div><b>${name}</b><small>${role}</small></div></div>`;
const turn = t => `<div class="turn"><span class="pill">Your turn</span><p>${t}</p></div>`;
const before = t => `<p class="before"><b>Without AutoPend:</b> ${t}</p>`;
const doneLine = t => `<div class="done-line"><i>✓</i><span>${t}</span></div>`;

function qr(){ let s=''; let x=7; for(let i=0;i<441;i++){ x=(x*1103515245+12345)&0x7fffffff; const r=Math.floor(i/21), c=i%21; const fin=(r<7&&c<7)||(r<7&&c>13)||(r>13&&c<7); let on; if(fin){ const rr=r>13?r-14:r, cc=c>13?c-14:c; on=(rr===0||rr===6||cc===0||cc===6)||(rr>1&&rr<5&&cc>1&&cc<5);} else on=(x>>8)%2===0; s+=`<i style="background:${on?'#111':'#fff'}"></i>`; } return `<div class="qr" aria-label="Sample QR code">${s}</div>`; }

/* ---------- render ---------- */
function render(){
  document.getElementById('steps').innerHTML = STEPS.map((t,i)=>`<button class="${i===S.step?'on':isDone(i)?'done':''}" data-a="jump" data-k="${i}" ${i===S.step?'aria-current="step"':''}><span class="n">${i}</span>${t}</button>`).join('');
  const col=collected();
  document.getElementById('meter').innerHTML = `<div><b>${inr(col)}</b><span>Collected today</span></div><div><b>${S.choice?1:0}</b><span>Orders stopped at the limit</span></div><div><b>${tallyCount()}</b><span>Entries sent to Tally</span></div><div class="zero"><b>0</b><span>Lines typed twice</span></div>`;
  const v=V[S.step];
  const last=S.step===STEPS.length-1;
  document.getElementById('story').innerHTML = v.story() + `<div class="nav">${S.step>0?'<button class="btn" data-a="back">Back</button>':''}${last?'':`<button class="btn pri" data-a="next">${S.step===0?'Start the day':isDone(S.step)?'Next':'Skip this step'}</button>`}</div>`;
  document.getElementById('stage').innerHTML = v.stage();
}

document.addEventListener('click', e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  const a=el.dataset.a;
  switch(a){
    case 'next': go(S.step+1); break;
    case 'back': go(S.step-1); break;
    case 'jump': go(+el.dataset.k); break;
    case 'msg1': S.sheet1=true; render(); break;
    case 'share1': S.sheet1=false; go(2); break;
    case 'save2': go(3); break;
    case 'c-collect': S.choice='collect'; render(); break;
    case 'c-hold': S.choice='hold'; render(); break;
    case 'deliver': S.s4='delivered'; render(); break;
    case 'sync': S.s4='syncing'; render(); later(()=>{S.s4='synced'; render();},1500); break;
    case 'accept': S.s4='accepted'; render(); break;
    case 'remind': go(6); break;
    case 'send': S.sent=true; render(); later(()=>{S.paid=true; render();},1800); break;
    case 'ov-pay': S.over='pay'; render(); break;
    case 'ov-ledger': S.over='ledger'; render(); break;
    case 'ov-close': S.over=null; render(); break;
    case 'shot': S.sheet6=true; render(); break;
    case 'share6': S.sheet6=false; if(S.s7!=='approved') S.s7='reading'; go(7); break;
    case 'approve': S.s7='approved'; render(); break;
    case 'thanks': S.thanks=true; render(); break;
    case 'notif': S.s8='open'; render(); break;
    case 'ask': S.ask=el.dataset.k; render(); break;
    case 'copy': { const t='+91 79734 13659'; const done=()=>{const c=document.getElementById('cp'); if(c) c.textContent='Copied';}; try{ navigator.clipboard.writeText(t).then(done,()=>{selectPh();}); }catch(err){ selectPh(); } break; }
    case 'restart': Object.assign(S,{sheet1:false,s2:'reading',choice:null,s4:'idle',sent:false,paid:false,sheet6:false,over:null,s7:'reading',thanks:false,s8:'lock',ask:null}); go(0); break;
  }
});
function selectPh(){ const p=document.getElementById('ph'); if(!p) return; const r=document.createRange(); r.selectNodeContents(p); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
render();
