services:
  - type: web
    name: autopend-landing
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: redirect
        source: /automation
        destination: /
        statusCode: 301
      - type: redirect
        source: /automation/*
        destination: /
        statusCode: 301
      - type: redirect
        source: /webdev
        destination: /
        statusCode: 301
      - type: redirect
        source: /webdev/*
        destination: /
        statusCode: 301
      - type: rewrite
        source: /*
        destination: /index.html
